[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facade-image-inspection"
version = "0.2.0"
description = "Image-first facade active inspection with frozen playbooks and bounded MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.0.11,<5", "langchain[mcp]>=1.4,<2", "langgraph>=1,<1.3",
  "langchain-openai>=1,<2",
  "numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.10",
  "requests>=2.32", "httpx>=0.27", "pydantic>=2.10", "python-dotenv>=1"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["reportlab>=4,<5"]
web = ["starlette>=0.40", "uvicorn>=0.30", "pypdf>=5,<7"]

[project.scripts]
facade-image = "facade_mcp.cli:main"
facade-image-mcp = "facade_mcp.image_server:main"
facade-workflow = "facade_mcp.cli:main"
facade-survey-mcp = "facade_mcp.survey_server:main"
facade-mask-mcp = "facade_mcp.mask_server:main"
facade-report-mcp = "facade_mcp.report_server:main"
facade-model-mcp = "facade_mcp.model_server:main"
facade-video-mcp = "facade_mcp.video_server:main"
facade-web = "facade_mcp.web_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facade_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
